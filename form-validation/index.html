<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script type="application/javascript">
      function checkdata() {
        // 1. Criamos referências para os valores dos elementos que iremos validar
        var username = document.getElementById("name");
        var email_address = document.getElementById("email");

        // 2. Verifica se o valor do campo nome for vazio ou nulo traz o foco para o campo com problema e emite um alerta
        if (!username.value) {
          alert("Por favor insira o nome");
          username.focus();
          return false;
        }
        // 3. Verifica se o valor do campo de email for vazio ou nulo traz o foco para o campo com problema e emite um alerta
        if (!email_address.value) {
          alert("Por favor insira o email");
          email_address.focus();
          return false;
        }

        alert("Tudo certo, muito obrigado pelo envio!");
      }
    </script>
    <title>Detalhes de Contato</title>
  </head>
  <body>
    <div class="d-flex justify-content-center mt-5">
      <div class="card border border-primary rounded-3 p-3 col-6">
        <div class="card-body">
          <div class="card-title h-4 mb-4 text-center">
            <h2>Insira seus dados de contato:</h2>
          </div>
          <form id="form1" onsubmit="return checkdata();">
            <div class="mb-3">
              <label for="name" class="form-label">Nome:</label>

              <input
                type="text"
                name="name"
                id="name"
                placeholder="Insira seu Nome"
                class="form-control"
              />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Endereço de Email:</label>

              <input
                type="text"
                name="email"
                id="email"
                placeholder="Insira seu Email"
                class="form-control"
              />
            </div>

            <div class="d-flex gap-2 justify-content-end mt-4">
              <input type="submit" value="Enviar" />

              <input type="reset" value="Reiniciar" />
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
