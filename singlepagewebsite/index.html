<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Antonio Carlos - Portfólio</title>
</head>
<body>
    <header class="header-global">
        <nav class="nav-menu">

        </nav>
    </header>

    <main class="main-container">
        
        <section class="section-hero">

            <div class="container">

                <h1 class="hero-title">

                </h1>

                <p class="hero-subtitle">

                </p>

            </div>

        </section>

        <section id="about-me" class="section-content section-content--gray">

            <div class="container">

                <h2 class="section-title"></h2>
                <p class="about-text"></p>

            </div>

        </section>

        <section id="skills" class="section-content">

            <div class="container">
                <h2 class="section-title">
                </h2>

                <ul class="skills-grid">
                    <li class="skill-item"></li>
                    <li class="skill-item"></li>
                    <li class="skill-item"></li>
                    <li class="skill-item"></li>
                </ul>
            </div>

        </section>

        <section id="projects" class="section-content">

            <div class="container">
                <h2 class="section-title"></h2>
                <div class="portfolio-grid">

                    <article class="project-card">

                        <img src="" alt="" class="project-card__image">
                        <h2 class="project-card__title"></h2>
                        <p class="project-card__text"></p>
                        <div class="project-card__tags"></div>
                        <a href="" class="btn-primary"></a>

                    </article>


                </div>
            </div>

        </section>

        <section id="contact" class="section-content">
            <div class="container">
                <h2 class="section-title"></h2>
                <ul class="contact-grid">
                    <li class="contact-item"></li>
                    <li class="contact-item"></li>
                    <li class="contact-item"></li>
                    <li class="contact-item"></li>
                </ul>
            </div>
        </section>
        
        <section id="recommendations" class="section-content">
            <div class="container">
                <h2 class="section-title"></h2>
                <div class="recommendations-grid">
                    <article class="recommendation-item">
                        <span class="recommendation-item__quote">&#8220;</span>
                        <h3 class="recommendation-item__title"></h3>
                        <p class="recommendation-item__text"></p>
                        <span class="quote">&#8221;</span>
                    </article>

                    <article class="recommendation-item">
                        <span class="recommendation-item__quote">&#8220;</span>
                        <h3 class="recommendation-item__title"></h3>
                        <p class="recommendation-item__text"></p>
                        <span class="quote">&#8221;</span>
                    </article>

                    <article class="recommendation-item">
                        <span class="recommendation-item__quote">&#8220;</span>
                        <h3 class="recommendation-item__title"></h3>
                        <p class="recommendation-item__text"></p>
                        <span class="quote">&#8221;</span>
                    </article>
                </div>
            </div>
        </section>

        <section id="recommend-me" class="section-content">
            <div class="container">
                <h2 class="section-title"></h2>
                <div class="leave-recommendation">
                    <fieldset class="recommendation-form">
                        <legend class="recommendation-form__title"></legend>
                        <input type="text" class="recommendation-form__input">
                        <textarea name="" id="" class="recommendation-form__message"></textarea>
                        <div class="recommendation-form__action">
                            <button class="recommendation-form__btn"></button>
                        </div>
                    </fieldset>
                </div>
            </div>
        </section>

        <div class="iconbutton">
            <a href="#home"></a>
        </div>

        <div class="popup">
            <img src="" alt="" class="popup__img">
            <h3 class="popup__title"></h3>
            <button class="popup__btn"></button>
        </div> 




    </main>

    <footer class="footer-global">
        <div class="container">
            <p class="footer-text"></p>
            <ul class="footer-page-links">
                <li class="page-link"></li>
                <li class="page-link"></li>
                <li class="page-link"></li>
                <li class="page-link"></li>
                <li class="page-link"></li>
                <li class="page-link"></li>
                <li class="page-link"></li>
            </ul>
        </div>
    </footer>

</body>
</html>
